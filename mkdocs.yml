# ---------------------------------------------------------------------------
# Site metadata
# ---------------------------------------------------------------------------
site_name: "Interaktive Visualisierung von Forschungsdaten mit Posit Connect"
site_description: "Dokumentation interaktive Visualisierung von Forschungsdaten mit Posit Connect"
# site_url must be the full base URL so that alternate links resolve correctly
# on GitHub Pages project sites (which are served under a subdirectory).
# Update this if you use a custom domain.
site_url: https://zhaw-dataservices.github.io/posit-connect-docs/
repo_url: https://github.com/zhaw-dataservices/posit-connect-docs
repo_name: zhaw-dataservices/posit-connect-docs

# ---------------------------------------------------------------------------
# Theme — Material for MkDocs
# font: false disables Material's own Google Fonts request; the corporate
# font (Inter) is loaded and set via extra_css instead.
# ---------------------------------------------------------------------------
theme:
  name: material
  logo: assets/zhaw-logo.svg
  favicon: assets/zhaw-logo.svg
  font: false             # disable Material's font handling; Inter is set via extra_css
  palette:
    scheme: default
    primary: custom       # resolved via extra_css to #0064a6
  language: de
  features:
    - navigation.top      # back-to-top button

# ---------------------------------------------------------------------------
# Markdown extensions
# admonition enables the "!!! note "..."" boxes used e.g. in template.md.
# pymdownx.snippets inlines the ablauf.svg/.en.svg diagrams directly into the
# page HTML (via "--8<--" includes). This is deliberate: MkDocs only rewrites
# relative paths on <a href> and <img src> (see mkdocs/structure/pages.py,
# _RelativePathTreeprocessor) -- it does NOT touch <object data="...">, so an
# object-embedded SVG 404s on any page other than the site root once
# use_directory_urls nests pages under their own folder (e.g. /ablauf/).
# Inlining sidesteps the problem entirely: no separate request, no path to
# get wrong, and the <a href="mailto:...">/<a href="https://servicedesk...">
# links inside the SVG become real, clickable DOM anchors.
# ---------------------------------------------------------------------------
markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path: ["docs"]

# ---------------------------------------------------------------------------
# Custom CSS
# ---------------------------------------------------------------------------
extra_css:
  - stylesheets/extra.css

# ---------------------------------------------------------------------------
# Language switcher — renders the globe icon + dropdown in the Material header.
# Full absolute URLs are required; root-relative paths (/en/) break on GitHub
# Pages project sites because the site is not served from the domain root.
# ---------------------------------------------------------------------------
extra:
  alternate:
    - name: Deutsch
      link: https://zhaw-dataservices.github.io/posit-connect-docs/
      lang: de
    - name: English
      link: https://zhaw-dataservices.github.io/posit-connect-docs/en/
      lang: en

# ---------------------------------------------------------------------------
# Plugins
# mkdocs-static-i18n reads the file suffix (.en.md / .md) to serve translated
# pages. "de" is the default; the English build is published under /en/.
# The language switcher appears automatically in the Material header.
# Install: pip install mkdocs-static-i18n
# ---------------------------------------------------------------------------
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true
          # Translate the header title for the English build.
          site_name: "Interactive Visualization of Research Data with Posit Connect"
          # Translate the nav labels (which come from mkdocs.yml, not the pages).
          # Maps each German nav label to its English equivalent.
          nav_translations:
            Review & Veröffentlichung: Review & Publishing
            App entwickeln: Develop Your App
            Templates: Templates
            Barrierefreiheit: Accessibility
            Datenquellen & Datenzugriff: Data Sources & Access
            Daten aus REDCap laden: Loading Data from REDCap
            Code teilen via GitHub: Share Code via GitHub
            Allgemeines: General

# ---------------------------------------------------------------------------
# Navigation — list pages explicitly so the order is predictable.
# Each entry is: "Menu label": path/to/file.md
# ---------------------------------------------------------------------------
nav:
  - Home: index.md
  - App entwickeln:
    - Allgemeines: app-entwickeln/general.md
    - Templates: app-entwickeln/template.md
    - Shiny Basics: app-entwickeln/shiny-basics.md
    - Streamlit Basics: app-entwickeln/streamlit-basics.md
    - Datenquellen & Datenzugriff: app-entwickeln/daten.md
    - Daten aus REDCap laden: app-entwickeln/redcap.md
  - Code teilen via GitHub: code-teilen/github-zhaw.md
  #- Best Practices:
    #- Shiny (R): app-entwickeln/best-practices-shiny.md
    #- Streamlit (Python): app-entwickeln/best-practices-streamlit.md
    #- Quarto: app-entwickeln/best-practices-quarto.md
    #- Barrierefreiheit: app-entwickeln/best-practices-barrierefreiheit.md
  - Review & Veröffentlichung: deployment.md
  - FAQ: support.md
